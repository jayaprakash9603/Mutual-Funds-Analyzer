server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  application:
    name: mutual-funds-analyzer
  mvc:
    async:
      # Long-lived SSE connections for report-ready notifications.
      request-timeout: 1800000
  profiles:
    default: mysql
    # Every relational profile also activates "relational", which carries the JPA settings and the
    # Mongo autoconfigure exclusions they all share.
    group:
      mysql: relational
      h2: relational
      postgres: relational
      jpa: relational
  # Nothing persistence-related autoconfigures unless a profile opts back in.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

features:
  analysis:
    enabled: true
    compare: true
    insights: true
    timeline: true
    persistResults: false
    fundIndexMatrix: true
    incrementalAggregates: true
    incrementalMatrixSnapshots: true
    persistFundReport: true
    fundReport: true
    peerComparison: true
  ui:
    landingPage: true
    methodPage: true
    # Analyze and Compare are dormant; the fund report is the only analysis surface.
    dashboardPage: false
    comparePage: false
    commandPalette: true
    favorites: true
    recentAnalyses: true
    themeToggle: true
    statCards: true
    rollingReturnsPanel: true
    fundIndexMatrixTable: true
    riskMeter: true
    insightsPanel: true
    performanceTimeline: true
    additionalCharts: true
    exportPdf: false
    share: true
    fundReportPage: true
  platform:
    cache:
      enabled: true
      ttl: 1h
      maxSize: 10000
      maxWeightMb: 512
    rateLimit:
      enabled: false
      perMinute: 60
    persistence:
      enabled: false
      type: none
    openapi:
      enabled: true
    apiExporter:
      enabled: true
  upstream:
    host: analysis.investt.in
    basePath: /mutual-funds-research
    timeout: 60s
    defaultStartDate: 01-01-2013
  mfapi:
    host: api.mfapi.in
    timeout: 20s
    navTtl: 6h
  sync:
    enabled: false
    daily-cron: "0 30 7 * * *"
    max-attempts-per-day: 3
    zone-id: Asia/Kolkata

analytics:
  riskFreeRate: 0.06
  tradingDays: 252
  refreshAfter: 7d
  computePoolSize: # defaults to availableProcessors (minimum 2)
  computeQueueCapacity: 64
  upstreamPoolSize: 16
  upstreamQueueCapacity: 64
  matrixPoolSize: 6
  matrixQueueCapacity: 24
  matrixPeriods:
    - 1 Year
    - 3 Year
    - 5 Year
    - 7 Year
    - 10 Year
    - 15 Year

report:
  earliestStartDate: 01-01-1995
  inflationRate: 7.0

springdoc:
  api-docs:
    enabled: ${features.platform.openapi.enabled:true}
  swagger-ui:
    enabled: ${features.platform.openapi.enabled:true}

api-exporter:
  enabled: ${features.platform.apiExporter.enabled:true}
  endpoint:
    base-path: /api-export
  metadata:
    title: Mutual Funds Analyzer
    description: Golden Triangle Mutual Fund Analyzer REST API
    version: 0.0.1-SNAPSHOT
  server:
    base-url: "{{baseUrl}}"
  discovery:
    enabled: true
    mode: startup
    refresh-enabled: false
  schemas:
    enabled: true
  examples:
    enabled: true
  exporters:
    postman:
      enabled: true
    insomnia:
      enabled: true
    openapi:
      enabled: true
    curl:
      enabled: true
    http:
      enabled: true
    markdown:
      enabled: true
    html:
      enabled: true
  security:
    enabled: false
    mask-sensitive-fields: true
  openapi:
    version: 3.1.0
