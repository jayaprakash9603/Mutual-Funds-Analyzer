# Static demo frontend for Cloudflare.
# Build: npm run build  →  output in ./dist
#
# Your dashboard Deploy command is `npx wrangler deploy`, so this file must
# declare [assets] (Workers static assets). Without it, deploy fails with
# "Missing entry-point to Worker script or to assets directory".
#
# SPA fallback is handled via not_found_handling (plus public/_redirects for Pages).

name = "mutual-funds-analyzer"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
